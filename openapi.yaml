openapi: 3.0.3
info:
  title: Diasorin Digital Shipment Form API
  version: 0.1.0
  description: Backend API for DSI-FORM-000208.
paths:
  /api/admin/permissions:
    get:
      operationId: admin_permissions_retrieve
      description: Read-only role -> area -> action map (admin tab, DSF-09.14).
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsOut'
          description: ''
  /api/approvals:
    get:
      operationId: approvals_list
      description: 'The approver''s queue (DSF-04.x approver view): oldest first,
        with age and SLA class.'
      parameters:
      - in: query
        name: filter
        schema:
          type: string
          enum:
          - all
          - decided
          - pending
        description: 'Default: pending'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search reference, applicant, recipient, cost centre
      tags:
      - approvals
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalRowList'
          description: ''
  /api/approvals/my-cost-centres:
    get:
      operationId: approvals_my_cost_centres
      description: '"Cost centres you approve for" (queue footer).'
      tags:
      - approvals
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyCostCentre'
          description: ''
  /api/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/auth/request-code:
    post:
      operationId: auth_request_code_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCodeInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestCodeInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestCodeInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCodeOut'
          description: ''
        '403':
          description: 'Refused: {code, message}'
        '429':
          description: 'Cooldown or rate limit: {code, message, retry_after_seconds}'
  /api/auth/verify:
    post:
      operationId: auth_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          description: '{code: wrong|expired|locked, message}'
        '403':
          description: 'Refused: {code, message}'
  /api/health:
    get:
      operationId: health_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/masterdata/branches:
    get:
      operationId: masterdata_branches_list
      description: Authenticated, active rows only, not paginated. `?destination=`
        narrows lists that depend on it.
      parameters:
      - in: query
        name: destination
        schema:
          type: string
          enum:
          - EU
          - EXTRA_EU
          - ITALY
          - USA
      tags:
      - masterdata
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
          description: ''
  /api/masterdata/carriers:
    get:
      operationId: masterdata_carriers_list
      description: Authenticated, active rows only, not paginated. `?destination=`
        narrows lists that depend on it.
      tags:
      - masterdata
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Carrier'
          description: ''
  /api/masterdata/cost-centres:
    get:
      operationId: masterdata_cost_centres_list
      description: 'Active cost centres for the signed-in user (reference list: not
        paginated).'
      tags:
      - masterdata
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CostCentre'
          description: ''
  /api/masterdata/countries:
    get:
      operationId: masterdata_countries_list
      description: 'Italy: Italy only; USA: United States only; EU / Extra-EU: their
        countries (DSF-03.05).'
      parameters:
      - in: query
        name: destination
        schema:
          type: string
          enum:
          - EU
          - EXTRA_EU
          - ITALY
          - USA
      tags:
      - masterdata
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
          description: ''
  /api/masterdata/currencies:
    get:
      operationId: masterdata_currencies_list
      tags:
      - masterdata
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurrencyItem'
          description: ''
  /api/masterdata/packaging:
    get:
      operationId: masterdata_packaging_list
      description: Authenticated, active rows only, not paginated. `?destination=`
        narrows lists that depend on it.
      tags:
      - masterdata
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Packaging'
          description: ''
  /api/masterdata/pvari:
    get:
      operationId: masterdata_pvari_list
      description: Authenticated, active rows only, not paginated. `?destination=`
        narrows lists that depend on it.
      tags:
      - masterdata
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PVARI'
          description: ''
  /api/masterdata/reason-codes:
    get:
      operationId: masterdata_reason_codes_list
      description: Authenticated, active rows only, not paginated. `?destination=`
        narrows lists that depend on it.
      parameters:
      - in: query
        name: destination
        schema:
          type: string
          enum:
          - EU
          - EXTRA_EU
          - ITALY
          - USA
      tags:
      - masterdata
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReasonCode'
          description: ''
  /api/masterdata/ships-from:
    get:
      operationId: masterdata_ships_from_list
      description: Ships-from sites with their calendar, read from the database on
        every call (AC-03.03.4).
      tags:
      - masterdata
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShipsFrom'
          description: ''
  /api/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/me/counts:
    get:
      operationId: me_counts
      tags:
      - me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeCounts'
          description: ''
  /api/me/view:
    post:
      operationId: me_view_create
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchViewInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SwitchViewInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SwitchViewInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/public/site:
    get:
      operationId: public_site_retrieve
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSite'
          description: ''
  /api/requests:
    get:
      operationId: requests_list
      parameters:
      - in: query
        name: filter
        schema:
          type: string
          enum:
          - all
          - attention
          - closed
          - drafts
          - open
        description: All, Open, Needs attention, Drafts, Closed
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search reference, recipient, branch, PVARI code, description,
          cost centre, status
      - in: query
        name: scope
        schema:
          type: string
        description: mine (the only value today)
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - -created
          - -reference
          - -ship_day
          - created
          - reference
          - ship_day
      - in: query
        name: status
        schema:
          type: string
        description: Comma-separated statuses
      tags:
      - requests
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRequestListList'
          description: ''
    post:
      operationId: requests_create
      description: 'Create the draft on the first save. Send `step: 1` in the body
        for Continue (validates step 1 first and creates nothing on errors); without
        it this is Save draft.'
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestWriteRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
  /api/requests/{ref}:
    get:
      operationId: requests_retrieve
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
  /api/requests/{ref}/approve:
    post:
      operationId: requests_approve
      description: POST one transition; the response is the refreshed request detail.
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentBodyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentBodyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentBodyRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
  /api/requests/{ref}/attachments:
    post:
      operationId: requests_attachments_create
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/requests/{ref}/attachments/{att_id}:
    get:
      operationId: requests_attachments_download
      parameters:
      - in: path
        name: att_id
        schema:
          type: integer
        required: true
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      responses:
        '200':
          description: No response body
    delete:
      operationId: requests_attachments_delete
      parameters:
      - in: path
        name: att_id
        schema:
          type: integer
        required: true
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      responses:
        '204':
          description: No response body
  /api/requests/{ref}/cancel:
    post:
      operationId: requests_cancel
      description: POST one transition; the response is the refreshed request detail.
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBodyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReasonBodyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonBodyRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
  /api/requests/{ref}/comments:
    get:
      operationId: requests_comments_list
      description: 'The conversation: events with `in_conversation`, as this viewer
        may see them.'
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
          description: ''
    post:
      operationId: requests_comments_create
      description: 'The conversation: events with `in_conversation`, as this viewer
        may see them.'
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostBodyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PostBodyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostBodyRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/requests/{ref}/discard:
    post:
      operationId: requests_discard
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
  /api/requests/{ref}/draft:
    patch:
      operationId: requests_save_draft
      description: 'Save draft: save whatever is typed, no validation.'
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRequestWriteRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
  /api/requests/{ref}/duplicate:
    post:
      operationId: requests_duplicate
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
  /api/requests/{ref}/events:
    get:
      operationId: requests_events
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
          description: ''
  /api/requests/{ref}/reassign-approver:
    post:
      operationId: requests_reassign_approver
      description: POST one transition; the response is the refreshed request detail.
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignBodyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReassignBodyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReassignBodyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
  /api/requests/{ref}/reject:
    post:
      operationId: requests_reject
      description: POST one transition; the response is the refreshed request detail.
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentBodyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentBodyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentBodyRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
  /api/requests/{ref}/return:
    post:
      operationId: requests_return
      description: POST one transition; the response is the refreshed request detail.
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnBodyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReturnBodyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReturnBodyRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
  /api/requests/{ref}/skip-approval:
    post:
      operationId: requests_skip_approval
      description: POST one transition; the response is the refreshed request detail.
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBodyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReasonBodyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonBodyRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
  /api/requests/{ref}/steps/{n}:
    patch:
      operationId: requests_save_step
      description: 'Continue: validate step n only, then save it.'
      parameters:
      - in: path
        name: n
        schema:
          type: integer
        required: true
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRequestWriteRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
        '400':
          description: '{step, errors}'
  /api/requests/{ref}/submit:
    post:
      operationId: requests_submit
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitBodyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitBodyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitBodyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
          description: ''
        '400':
          description: '{step, errors}'
  /api/requests/export.csv:
    get:
      operationId: requests_export
      description: 'CSV of the currently filtered list: same rows and columns as the
        My requests table (DSF-04.02).'
      tags:
      - requests
      responses:
        '200':
          description: No response body
components:
  schemas:
    ActorRoleEnum:
      enum:
      - requester
      - approver
      - customer_management
      - admin
      - system
      type: string
      description: |-
        * `requester` - Requester
        * `approver` - Cost Centre Approver
        * `customer_management` - Customer Management
        * `admin` - Administrator
        * `system` - System
    ApprovalHint:
      type: object
      description: What submit would do for the cost centre (the routing function
        in dry-run mode).
      properties:
        required:
          type: boolean
        why:
          type: string
        approvers:
          type: array
          items:
            type: string
      required:
      - approvers
      - required
      - why
    ApprovalRow:
      type: object
      properties:
        reference:
          type: string
          maxLength: 16
        status:
          $ref: '#/components/schemas/ToStatusEnum'
        last_submitted_at:
          type: string
          format: date-time
          nullable: true
        applicant_name:
          type: string
          nullable: true
          maxLength: 200
        requester_name:
          type: string
          readOnly: true
        destination:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/DestinationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        consignee_company:
          type: string
          nullable: true
          maxLength: 200
        recipient_branch_name:
          type: string
          nullable: true
          maxLength: 200
        cost_centre_code:
          type: string
          nullable: true
          maxLength: 20
        cost_centre_name:
          type: string
          readOnly: true
        line_count:
          type: integer
          readOnly: true
        total_weight_kg:
          type: string
          readOnly: true
        overall_temperature:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/DefaultTemperatureEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        round_state:
          type: string
          nullable: true
          readOnly: true
        age_hours:
          type: integer
          nullable: true
          readOnly: true
        sla_class:
          type: string
          nullable: true
          readOnly: true
        escalated:
          type: boolean
          readOnly: true
        can_decide:
          type: boolean
          readOnly: true
        decided_at:
          type: string
          format: date-time
